databaseChangeLog:
  - changeSet:
      id: 001-create-muscle
      author: juan
      changes:
        - createTable:
            tableName: muscle
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
